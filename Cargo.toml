[package]
name = "psr-e463-ui"
version = "0.1.0"
edition = "2021"
description = "Native configurable PSR-E463 emulator panel UI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "psr-e463-ui"
path = "src/main.rs"

[dependencies]
cairo-rs = "0.18"
gtk = { package = "gtk", version = "0.18" }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_arm"] }

[build-dependencies]
serde_json = "1"
