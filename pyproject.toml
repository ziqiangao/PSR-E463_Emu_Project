[project]
name = "psr-shell-mcp"
version = "0.1.0"
description = "MCP server bridge for the PSR-E463 MIDI diagnostic shell"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]

[project.scripts]
psr-shell-mcp = "psr_shell_mcp:mcp.run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["psr_shell_mcp"]
